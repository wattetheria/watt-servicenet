services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data

  servicenet:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WATTSWARM_REPO: ${WATTSWARM_REPO:-https://github.com/wattetheria/wattswarm.git}
        WATTSWARM_REF: ${WATTSWARM_REF:-main}
        WATT_DID_REPO: ${WATT_DID_REPO:-https://github.com/wattetheria/watt-did.git}
        WATT_DID_REF: ${WATT_DID_REF:-main}
        WATT_WALLET_REPO: ${WATT_WALLET_REPO:-https://github.com/wattetheria/watt-wallet.git}
        WATT_WALLET_REF: ${WATT_WALLET_REF:-main}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVICENET_DATABASE_URL: ${SERVICENET_DATABASE_URL:?SERVICENET_DATABASE_URL must be set}
      SERVICENET_DATABASE_SCHEMA: ${SERVICENET_DATABASE_SCHEMA:-public}
      SERVICENET_HTTP_ADDR: ${SERVICENET_HTTP_ADDR:-0.0.0.0:8042}
      SERVICENET_REQUIRE_PROVIDER_OWNERSHIP_CHALLENGES: ${SERVICENET_REQUIRE_PROVIDER_OWNERSHIP_CHALLENGES:-1}
      SERVICENET_SECRET_BROKER_KEY: ${SERVICENET_SECRET_BROKER_KEY:?SERVICENET_SECRET_BROKER_KEY must be set}
      SERVICENET_P2P_ENABLED: ${SERVICENET_P2P_ENABLED:-0}
    ports:
      - "8042:8042"
    volumes:
      - ./.data:/data
